[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/gzip_web.py

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.3
    bblanchon/ArduinoJson @ ^7.0.4

[env:lolin_c3_pico]
platform = espressif32
; The original LOLIN C3 Pico board ID was removed from recent platforms;
; the generic C3 devkit board matches its 4 MB flash / ESP32-C3 SoC.
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/gzip_web.py
build_flags =
    -D BOARD_LOLIN_C3_PICO
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.3
    bblanchon/ArduinoJson @ ^7.0.4

[env:cyd]
; ESP32-2443S028R "Cheap Yellow Display": ESP32-WROOM-32 + 2.8" ILI9341 TFT
; (320x240 landscape) + XPT2046 touch + RGB LED + LDR + speaker + SD.
; Display on HSPI: MOSI 13, MISO 12, SCK 14, CS 15, DC 2, BL 21, RST = EN.
; Touch on its own SPI bus: CLK 25, MOSI 32, MISO 39, CS 33, IRQ 36.
; S.Port: RX2 = GPIO 22 (JST, via 1k), TX2 = GPIO 27 (JST, via 330R-1k).
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/gzip_web.py
build_flags =
    -D BOARD_CYD_2443S028
    -D USER_SETUP_LOADED
    -D ILI9341_2_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4

lib_deps =
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.3
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TFT_eSPI
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

