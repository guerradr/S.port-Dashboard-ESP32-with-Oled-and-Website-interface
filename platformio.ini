[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/gzip_web.py

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.3
    bblanchon/ArduinoJson @ ^7.0.4

[env:lolin_c3_pico]
platform = espressif32
; The original LOLIN C3 Pico board ID was removed from recent platforms;
; the generic C3 devkit board matches its 4 MB flash / ESP32-C3 SoC.
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
extra_scripts = pre:scripts/gzip_web.py
build_flags =
    -D BOARD_LOLIN_C3_PICO
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit SSD1306 @ ^2.5.9
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
    ESP32Async/AsyncTCP @ ^3.3.3
    bblanchon/ArduinoJson @ ^7.0.4
